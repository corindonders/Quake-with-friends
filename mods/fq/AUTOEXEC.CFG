// Grappling Hook

alias   I_hook  "impulse 98"
alias	I_grow	"impulse 97"
alias I_shrink	"impulse 96"
alias I_stop	"impulse 95"

//alias +hook "I_hook; wait; I_shrink"
//alias -hook "I_stop"

alias +grow I_grow
alias -grow I_stop

alias +shrink I_shrink
alias -shrink I_stop

bind z I_hook
bind x +grow                    // for sliding down the chain
bind c +shrink                  // for climbing up the chain

bind b dropgold
bind n drop_ammo
bind m drop_item
bind . next_item
bind , prev_item
bind / use_item
bind \ inventory

bind ] spellson
bind [ spelllist

//bind i look
bind y messagemode2

bind BACKSPACE display
bind HOME cycleclass

bind ' xpcheat
bind * debug
bind semicolon gimme

bind 9 "impulse 9"
bind 0 "impulse 10"

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind MOUSE1 +attack
bind MOUSE2 look

sv_maxspeed 500
crosshair 1
+mlook
sv_aim 1
gl_flashblend 0
