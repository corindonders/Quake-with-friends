<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quake with Friends — Login</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		:root {
			--bg: #0b0908;
			--panel: #171310;
			--panel-border: #332920;
			--text: #d8cfc4;
			--text-dim: #8a7d6e;
			--accent: #b23b2e;
			--accent-bright: #e0523f;
			--error: #e0523f;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background: var(--bg) url('background.webp') center / cover no-repeat fixed;
			color: var(--text);
			font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.card {
			width: 320px;
			background: rgba(23, 19, 16, 0.88);
			backdrop-filter: blur(6px);
			border: 1px solid var(--panel-border);
			border-radius: 8px;
			padding: 32px;
		}

		.card img { width: 44px; height: 44px; display: block; margin: 0 auto 12px; }

		h1 {
			margin: 0 0 4px;
			font-size: 18px;
			text-align: center;
			font-weight: 600;
		}

		p.sub {
			margin: 0 0 24px;
			text-align: center;
			font-size: 12.5px;
			color: var(--text-dim);
		}

		label {
			display: block;
			font-size: 12px;
			color: var(--text-dim);
			margin-bottom: 6px;
		}

		input {
			width: 100%;
			background: #0f0c0a;
			border: 1px solid var(--panel-border);
			color: var(--text);
			padding: 10px 12px;
			border-radius: 4px;
			font-size: 14px;
			outline: none;
			margin-bottom: 16px;
		}

		input:focus { border-color: var(--accent); }

		button {
			width: 100%;
			background: var(--accent);
			color: #fff;
			border: none;
			padding: 11px;
			border-radius: 4px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			letter-spacing: 0.3px;
		}

		button:hover:not(:disabled) { background: var(--accent-bright); }
		button:disabled { opacity: 0.6; cursor: default; }

		.error {
			display: none;
			background: #2a1512;
			border: 1px solid var(--error);
			color: var(--error);
			font-size: 12.5px;
			padding: 8px 10px;
			border-radius: 4px;
			margin-bottom: 16px;
		}

		.hint {
			margin-top: 18px;
			text-align: center;
			font-size: 11.5px;
			color: var(--text-dim);
		}
		.hint a { color: var(--accent-bright); }
	</style>
</head>
<body>

	<div class="card">
		<img src="icon.svg" alt="">
		<h1>Quake with Friends</h1>
		<p class="sub">Sign in to enter the hub.</p>

		<div id="error" class="error"></div>

		<form id="loginForm">
			<label for="username">Username</label>
			<input id="username" name="username" type="text" autocomplete="username" required autofocus>

			<label for="password">Password</label>
			<input id="password" name="password" type="password" autocomplete="current-password" required>

			<button id="submitBtn" type="submit">Log in</button>
		</form>

		<div class="hint">Ask the admin for an account. New here? Check the <a href="wiki.html">wiki</a>.</div>
	</div>

	<script src="server-config.js"></script>
	<script type="module">

		import { login, getSession } from './src/auth_client.js';

		// Already logged in? Skip straight through.
		const params = new URLSearchParams( location.search );
		const next = params.get( 'next' ) || 'hub.html';

		if ( getSession() !== null ) {

			location.href = next;

		}

		const form = document.getElementById( 'loginForm' );
		const errorBox = document.getElementById( 'error' );
		const submitBtn = document.getElementById( 'submitBtn' );

		form.addEventListener( 'submit', async ( e ) => {

			e.preventDefault();
			errorBox.style.display = 'none';
			submitBtn.disabled = true;
			submitBtn.textContent = 'Logging in…';

			const username = document.getElementById( 'username' ).value.trim();
			const password = document.getElementById( 'password' ).value;

			try {

				await login( username, password );
				location.href = next;

			} catch ( err ) {

				errorBox.textContent = err.message;
				errorBox.style.display = 'block';
				submitBtn.disabled = false;
				submitBtn.textContent = 'Log in';

			}

		} );

	</script>

</body>
</html>
