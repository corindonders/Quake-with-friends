<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quake with Friends — Admin — Maps</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<link rel="stylesheet" href="admin.css">
</head>
<body>

	<header>
		<img src="icon.svg" alt="">
		<h1><a href="admin.html">Admin</a></h1>
		<nav>
			<a href="admin_users.html">Users</a>
			<a href="admin_maps.html" class="active">Maps</a>
			<a href="admin_rooms.html">Rooms</a>
		</nav>
		<div class="links">
			<a href="start.html">start</a>
			<a href="wiki.html">wiki</a>
			<a href="index.html">game</a>
			<a href="#" id="logoutLink">log out</a>
		</div>
	</header>

	<main>

		<section>
			<h2>Maps</h2>
			<table id="mapsTable">
				<thead>
					<tr><th>ID</th><th>Title</th><th>Category</th><th>Mod</th><th>Visible</th><th></th></tr>
				</thead>
				<tbody id="mapsBody"></tbody>
			</table>
			<div id="mapsEmpty" class="empty" hidden>No maps in the catalog.</div>

			<div style="margin-top:16px;">
				<button type="button" class="primary" id="addMapBtn">Add map</button>
			</div>
		</section>

	</main>

	<div id="status"></div>

	<dialog id="mapDialog" style="width:380px;">
		<h3 id="mapDialogTitle">Add map</h3>
		<form id="mapForm">
			<div class="field">
				<label for="mapId">ID (matches the map/bsp filename)</label>
				<input type="text" id="mapId" placeholder="e.g. frogsbog">
			</div>
			<div class="field">
				<label for="mapTitle">Title (shown to players)</label>
				<input type="text" id="mapTitle" required>
			</div>
			<div class="field">
				<label for="mapCategory">Category</label>
				<select id="mapCategory">
					<option value="mod">mod</option>
					<option value="custom">custom</option>
					<option value="vanilla">vanilla</option>
					<option value="deathmatch">deathmatch</option>
				</select>
			</div>
			<div class="field">
				<label for="mapMod">Mod display name (optional)</label>
				<input type="text" id="mapMod" placeholder="e.g. Copper">
			</div>
			<div class="field">
				<label for="mapLayers">Mod dirs to layer in (comma-separated, optional)</label>
				<input type="text" id="mapLayers" placeholder="e.g. mods/copper">
			</div>
			<div class="field">
				<label for="mapBlurb">Blurb (optional)</label>
				<input type="text" id="mapBlurb">
			</div>
			<div class="field checkfield">
				<input type="checkbox" id="mapHidden">
				<label for="mapHidden" style="margin:0">Hidden from players</label>
			</div>
			<div class="actions">
				<button type="button" class="btn" id="mapDialogCancel">Cancel</button>
				<button type="submit" class="primary" id="mapDialogSubmit">Save</button>
			</div>
		</form>
	</dialog>

	<script src="server-config.js"></script>
	<script type="module">

		import { requireAdminSession, logout } from './src/auth_client.js';
		import { api, showStatus, escapeHTML } from './admin_common.js';

		const session = requireAdminSession();

		document.getElementById( 'logoutLink' ).addEventListener( 'click', ( e ) => { e.preventDefault(); logout(); } );

		async function loadMaps() {

			const { maps } = await api( '/admin/api/maps' );
			const body = document.getElementById( 'mapsBody' );
			const empty = document.getElementById( 'mapsEmpty' );

			const ids = Object.keys( maps ).sort();
			body.innerHTML = '';
			empty.hidden = ids.length > 0;

			for ( const id of ids ) {

				const m = maps[ id ];
				const tr = document.createElement( 'tr' );
				tr.innerHTML = `
					<td><code>${ escapeHTML( id ) }</code></td>
					<td>${ escapeHTML( m.title ) }</td>
					<td><span class="badge">${ escapeHTML( m.category ) }</span></td>
					<td>${ escapeHTML( m.mod || '—' ) }</td>
					<td></td>
					<td></td>
				`;

				const visTd = tr.children[ 4 ];
				const visBtn = document.createElement( 'button' );
				visBtn.textContent = m.hidden ? 'Hidden' : 'Visible';
				if ( m.hidden ) visBtn.style.color = 'var(--text-dim)';
				visBtn.addEventListener( 'click', () => toggleMapHidden( id, ! m.hidden ) );
				visTd.appendChild( visBtn );

				const actionsTd = tr.children[ 5 ];

				const editBtn = document.createElement( 'button' );
				editBtn.textContent = 'Edit';
				editBtn.addEventListener( 'click', () => openMapDialog( id, m ) );
				actionsTd.appendChild( editBtn );

				const delBtn = document.createElement( 'button' );
				delBtn.textContent = 'Delete';
				delBtn.className = 'danger';
				delBtn.addEventListener( 'click', () => deleteMapRow( id ) );
				actionsTd.appendChild( delBtn );

				body.appendChild( tr );

			}

		}

		async function toggleMapHidden( id, hidden ) {

			try {

				await api( '/admin/api/maps/' + encodeURIComponent( id ), {
					method: 'PATCH',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify( { hidden } ),
				} );
				showStatus( ( hidden ? 'Hid ' : 'Unhid ' ) + id + '.' );
				loadMaps();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		async function deleteMapRow( id ) {

			if ( ! confirm( 'Remove "' + id + '" from the catalog? (The map file itself is untouched -- this only removes the listing.)' ) ) return;

			try {

				await api( '/admin/api/maps/' + encodeURIComponent( id ), { method: 'DELETE' } );
				showStatus( 'Removed ' + id + '.' );
				loadMaps();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		// Add/edit dialog

		const mapDialog = document.getElementById( 'mapDialog' );
		const mapIdInput = document.getElementById( 'mapId' );
		const mapLayersInput = document.getElementById( 'mapLayers' );
		const mapDialogSubmit = document.getElementById( 'mapDialogSubmit' );
		let editingMapId = null; // null while adding a new map

		function openMapDialog( id, entry ) {

			editingMapId = id || null;
			document.getElementById( 'mapDialogTitle' ).textContent = id ? 'Edit map' : 'Add map';

			mapIdInput.value = id || '';
			mapIdInput.disabled = !! id; // ID is fixed once created -- it has to match the actual map file

			document.getElementById( 'mapTitle' ).value = ( entry && entry.title ) || '';
			document.getElementById( 'mapCategory' ).value = ( entry && entry.category ) || 'mod';
			document.getElementById( 'mapMod' ).value = ( entry && entry.mod ) || '';
			mapLayersInput.value = ( entry && entry.layers ) ? entry.layers.join( ', ' ) : '';
			document.getElementById( 'mapBlurb' ).value = ( entry && entry.blurb ) || '';
			document.getElementById( 'mapHidden' ).checked = !! ( entry && entry.hidden );

			mapDialog.showModal();

		}

		document.getElementById( 'addMapBtn' ).addEventListener( 'click', () => openMapDialog( null, null ) );
		document.getElementById( 'mapDialogCancel' ).addEventListener( 'click', () => mapDialog.close() );

		document.getElementById( 'mapForm' ).addEventListener( 'submit', async ( e ) => {

			e.preventDefault();

			const id = editingMapId || mapIdInput.value.trim();

			mapDialogSubmit.disabled = true;

			try {

				const body = {
					title: document.getElementById( 'mapTitle' ).value.trim(),
					category: document.getElementById( 'mapCategory' ).value,
					mod: document.getElementById( 'mapMod' ).value.trim(),
					layers: mapLayersInput.value,
					blurb: document.getElementById( 'mapBlurb' ).value.trim(),
					hidden: document.getElementById( 'mapHidden' ).checked,
				};

				if ( editingMapId ) {

					await api( '/admin/api/maps/' + encodeURIComponent( editingMapId ), {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify( body ),
					} );
					showStatus( 'Updated ' + editingMapId + '.' );

				} else {

					await api( '/admin/api/maps', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify( Object.assign( { id }, body ) ),
					} );
					showStatus( 'Added ' + id + '.' );

				}

				mapDialog.close();
				loadMaps();

			} catch ( err ) {

				showStatus( err.message, true );

			} finally {

				mapDialogSubmit.disabled = false;

			}

		} );

		if ( session !== null ) {

			loadMaps().catch( ( e ) => showStatus( e.message, true ) );

		}

	</script>

</body>
</html>
