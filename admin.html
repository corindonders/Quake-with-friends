<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quake with Friends — Admin</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<link rel="stylesheet" href="admin.css">
</head>
<body>

	<header>
		<img src="icon.svg" alt="">
		<h1><a href="admin.html">Admin</a></h1>
		<div class="links">
			<a href="start.html">start</a>
			<a href="wiki.html">wiki</a>
			<a href="index.html">game</a>
			<a href="#" id="logoutLink">log out</a>
		</div>
	</header>

	<main>

		<div class="cards">
			<a class="card" href="admin_users.html">
				<div class="count" id="usersCount">—</div>
				<div class="label">Users</div>
			</a>
			<a class="card" href="admin_maps.html">
				<div class="count" id="mapsCount">—</div>
				<div class="label">Maps</div>
			</a>
			<a class="card" href="admin_rooms.html">
				<div class="count" id="roomsCount">—</div>
				<div class="label">Active rooms</div>
			</a>
		</div>

	</main>

	<div id="status"></div>

	<script src="server-config.js"></script>
	<script type="module">

		import { requireAdminSession, logout } from './src/auth_client.js';
		import { api, showStatus } from './admin_common.js';

		const session = requireAdminSession();

		document.getElementById( 'logoutLink' ).addEventListener( 'click', ( e ) => { e.preventDefault(); logout(); } );

		if ( session !== null ) {

			api( '/admin/api/users' ).then( ( { users } ) => {

				document.getElementById( 'usersCount' ).textContent = users.length;

			} ).catch( ( e ) => showStatus( e.message, true ) );

			api( '/admin/api/maps' ).then( ( { maps } ) => {

				document.getElementById( 'mapsCount' ).textContent = Object.keys( maps ).length;

			} ).catch( ( e ) => showStatus( e.message, true ) );

			api( '/admin/api/rooms' ).then( ( { rooms } ) => {

				document.getElementById( 'roomsCount' ).textContent = rooms.length;

			} ).catch( ( e ) => showStatus( e.message, true ) );

		}

	</script>

</body>
</html>
