<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quake with Friends — Admin</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		:root {
			--bg: #0b0908;
			--panel: #171310;
			--panel-border: #332920;
			--text: #d8cfc4;
			--text-dim: #8a7d6e;
			--accent: #b23b2e;
			--accent-bright: #e0523f;
			--good: #7fae6c;
			--input-bg: #0f0c0a;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			padding: 0;
			background: var(--bg);
			color: var(--text);
			font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
		}

		header {
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 24px 32px 18px;
			border-bottom: 1px solid var(--panel-border);
		}

		header img { width: 36px; height: 36px; flex-shrink: 0; }
		header h1 { margin: 0; font-size: 20px; font-weight: 600; }
		header .links { margin-left: auto; font-size: 12.5px; }
		header .links a { color: var(--text-dim); text-decoration: none; margin-left: 16px; }
		header .links a:hover { color: var(--text); }

		main { max-width: 900px; margin: 0 auto; padding: 24px 32px 64px; }

		section { margin-bottom: 40px; }

		section h2 {
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 1.5px;
			color: var(--text-dim);
			margin: 0 0 14px;
			padding-bottom: 8px;
			border-bottom: 1px solid var(--panel-border);
		}

		table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
		th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 10px; }
		td { padding: 9px 10px; border-top: 1px solid var(--panel-border); vertical-align: middle; }
		tr:hover td { background: #1a1512; }

		.badge {
			display: inline-block;
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			padding: 2px 6px;
			border-radius: 3px;
			background: #2a2018;
			color: var(--text-dim);
		}
		.badge.admin { background: #3a2418; color: var(--accent-bright); }
		.badge.hub { background: #1c2e1a; color: var(--good); }

		button, .btn {
			font-family: inherit;
			font-size: 12px;
			background: var(--panel);
			color: var(--text);
			border: 1px solid var(--panel-border);
			border-radius: 4px;
			padding: 5px 10px;
			cursor: pointer;
		}
		button:hover { border-color: var(--accent); }
		button.danger:hover { border-color: var(--accent); color: var(--accent-bright); }
		button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
		button.primary:hover { background: var(--accent-bright); }
		button:disabled { opacity: 0.5; cursor: default; }
		button + button { margin-left: 6px; }

		form.inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 16px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px; padding: 16px; }
		form.inline .field { display: flex; flex-direction: column; gap: 4px; }
		form.inline label { font-size: 11px; color: var(--text-dim); }
		form.inline input[type=text], form.inline input[type=password] {
			background: var(--input-bg); border: 1px solid var(--panel-border); color: var(--text);
			padding: 7px 9px; border-radius: 4px; font-size: 13px; width: 160px;
		}
		form.inline .checkfield { flex-direction: row; align-items: center; gap: 6px; }

		.empty { color: var(--text-dim); font-size: 13px; padding: 16px 0; }

		#status {
			position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
			background: var(--panel); border: 1px solid var(--panel-border); border-radius: 6px;
			padding: 10px 16px; font-size: 13px; display: none; z-index: 10;
		}
		#status.error { border-color: var(--accent); color: var(--accent-bright); }
		#status.ok { border-color: var(--good); color: var(--good); }

		dialog {
			background: var(--panel); color: var(--text); border: 1px solid var(--panel-border);
			border-radius: 8px; padding: 20px; width: 280px;
		}
		dialog::backdrop { background: rgba(0,0,0,0.6); }
		dialog h3 { margin: 0 0 14px; font-size: 14px; }
		dialog .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
		dialog label { font-size: 11px; color: var(--text-dim); }
		dialog input[type=password] {
			background: var(--input-bg); border: 1px solid var(--panel-border); color: var(--text);
			padding: 7px 9px; border-radius: 4px; font-size: 13px; width: 100%;
		}
		dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
	</style>
</head>
<body>

	<header>
		<img src="icon.svg" alt="">
		<h1>Admin</h1>
		<div class="links">
			<a href="start.html">start</a>
			<a href="maps.html">maps</a>
			<a href="wiki.html">wiki</a>
			<a href="index.html">game</a>
			<a href="#" id="logoutLink">log out</a>
		</div>
	</header>

	<main>

		<section>
			<h2>Users</h2>
			<table id="usersTable">
				<thead>
					<tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr>
				</thead>
				<tbody id="usersBody"></tbody>
			</table>
			<div id="usersEmpty" class="empty" hidden>No users yet.</div>

			<form class="inline" id="addUserForm">
				<div class="field">
					<label for="newUsername">Username</label>
					<input type="text" id="newUsername" maxlength="15" required autocomplete="off">
				</div>
				<div class="field">
					<label for="newPassword">Password</label>
					<input type="password" id="newPassword" required autocomplete="new-password">
				</div>
				<div class="field checkfield">
					<input type="checkbox" id="newIsAdmin">
					<label for="newIsAdmin" style="margin:0">Admin</label>
				</div>
				<button type="submit" class="primary">Add user</button>
			</form>
		</section>

		<section>
			<h2>Maps</h2>
			<table id="mapsTable">
				<thead>
					<tr><th>ID</th><th>Title</th><th>Category</th><th>Mod</th><th>Visible</th><th></th></tr>
				</thead>
				<tbody id="mapsBody"></tbody>
			</table>
			<div id="mapsEmpty" class="empty" hidden>No maps in the catalog.</div>

			<div style="margin-top:16px;">
				<button type="button" class="primary" id="addMapBtn">Add map</button>
			</div>
		</section>

		<section>
			<h2>Active Rooms</h2>
			<table id="roomsTable">
				<thead>
					<tr><th>Room</th><th>Map</th><th>Mod</th><th>Players</th><th>Created</th><th></th></tr>
				</thead>
				<tbody id="roomsBody"></tbody>
			</table>
			<div id="roomsEmpty" class="empty" hidden>No active rooms.</div>
		</section>

	</main>

	<div id="status"></div>

	<dialog id="passwordDialog">
		<h3>Reset password</h3>
		<form id="passwordForm">
			<div class="field">
				<label for="dialogUsername">User</label>
				<input type="text" id="dialogUsername" disabled style="background:#0f0c0a;border:1px solid #332920;color:#8a7d6e;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
			</div>
			<div class="field">
				<label for="dialogPassword">New password</label>
				<input type="password" id="dialogPassword" required autocomplete="new-password">
			</div>
			<div class="actions">
				<button type="button" class="btn" id="dialogCancel">Cancel</button>
				<button type="submit" class="primary">Set password</button>
			</div>
		</form>
	</dialog>

	<dialog id="mapDialog" style="width:380px;">
		<h3 id="mapDialogTitle">Add map</h3>
		<form id="mapForm">
			<div class="field">
				<label for="mapId">ID (matches the map/bsp filename)</label>
				<input type="text" id="mapId" placeholder="e.g. frogsbog" style="background:#0f0c0a;border:1px solid #332920;color:#d8cfc4;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
			</div>
			<div class="field">
				<label for="mapTitle">Title (shown to players)</label>
				<input type="text" id="mapTitle" required style="background:#0f0c0a;border:1px solid #332920;color:#d8cfc4;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
			</div>
			<div class="field">
				<label for="mapCategory">Category</label>
				<select id="mapCategory" style="background:#0f0c0a;border:1px solid #332920;color:#d8cfc4;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
					<option value="mod">mod</option>
					<option value="custom">custom</option>
					<option value="vanilla">vanilla</option>
					<option value="deathmatch">deathmatch</option>
				</select>
			</div>
			<div class="field">
				<label for="mapMod">Mod display name (optional)</label>
				<input type="text" id="mapMod" placeholder="e.g. Copper" style="background:#0f0c0a;border:1px solid #332920;color:#d8cfc4;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
			</div>
			<div class="field">
				<label for="mapLayers">Mod dirs to layer in (comma-separated, optional)</label>
				<input type="text" id="mapLayers" placeholder="e.g. mods/copper" style="background:#0f0c0a;border:1px solid #332920;color:#d8cfc4;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
			</div>
			<div class="field">
				<label for="mapBlurb">Blurb (optional)</label>
				<input type="text" id="mapBlurb" style="background:#0f0c0a;border:1px solid #332920;color:#d8cfc4;padding:7px 9px;border-radius:4px;font-size:13px;width:100%;">
			</div>
			<div class="field checkfield">
				<input type="checkbox" id="mapHidden">
				<label for="mapHidden" style="margin:0">Hidden from players</label>
			</div>
			<div class="actions">
				<button type="button" class="btn" id="mapDialogCancel">Cancel</button>
				<button type="submit" class="primary" id="mapDialogSubmit">Save</button>
			</div>
		</form>
	</dialog>

	<script src="server-config.js"></script>
	<script type="module">

		import { requireAdminSession, authedFetch, logout } from './src/auth_client.js';

		const session = requireAdminSession();
		if ( session === null ) { /* already redirected */ }

		document.getElementById( 'logoutLink' ).addEventListener( 'click', ( e ) => { e.preventDefault(); logout(); } );

		function showStatus( text, isError ) {

			const el = document.getElementById( 'status' );
			el.textContent = text;
			el.className = isError ? 'error' : 'ok';
			el.style.display = 'block';
			clearTimeout( showStatus._t );
			showStatus._t = setTimeout( () => { el.style.display = 'none'; }, 4000 );

		}

		async function api( path, options ) {

			const res = await authedFetch( path, options );
			let body = null;
			try { body = await res.json(); } catch ( e ) { /* empty body */ }

			if ( ! res.ok ) throw new Error( ( body && body.error ) || ( 'Request failed (' + res.status + ')' ) );
			return body;

		}

		function escapeHTML( s ) {

			const div = document.createElement( 'div' );
			div.textContent = String( s == null ? '' : s );
			return div.innerHTML;

		}

		function fmtDate( ms ) {

			if ( ! ms ) return '—';
			return new Date( ms ).toLocaleString();

		}

		// --- Users ---------------------------------------------------------

		async function loadUsers() {

			const { users } = await api( '/admin/api/users' );
			const body = document.getElementById( 'usersBody' );
			const empty = document.getElementById( 'usersEmpty' );

			body.innerHTML = '';
			empty.hidden = users.length > 0;

			for ( const u of users.sort( ( a, b ) => a.username.localeCompare( b.username ) ) ) {

				const tr = document.createElement( 'tr' );
				tr.innerHTML = `
					<td>${ escapeHTML( u.username ) }${ u.username === session.username ? ' <span class="badge">you</span>' : '' }</td>
					<td>${ u.isAdmin ? '<span class="badge admin">admin</span>' : '<span class="badge">player</span>' }</td>
					<td>${ fmtDate( u.createdAt ) }</td>
					<td></td>
				`;

				const actionsTd = tr.querySelector( 'td:last-child' );

				const pwBtn = document.createElement( 'button' );
				pwBtn.textContent = 'Reset password';
				pwBtn.addEventListener( 'click', () => openPasswordDialog( u.username ) );
				actionsTd.appendChild( pwBtn );

				const adminBtn = document.createElement( 'button' );
				adminBtn.textContent = u.isAdmin ? 'Remove admin' : 'Make admin';
				adminBtn.addEventListener( 'click', () => toggleAdmin( u.username, ! u.isAdmin ) );
				actionsTd.appendChild( adminBtn );

				const delBtn = document.createElement( 'button' );
				delBtn.textContent = 'Delete';
				delBtn.className = 'danger';
				delBtn.disabled = u.username === session.username;
				delBtn.addEventListener( 'click', () => deleteUserRow( u.username ) );
				actionsTd.appendChild( delBtn );

				body.appendChild( tr );

			}

		}

		async function toggleAdmin( username, isAdmin ) {

			try {

				await api( '/admin/api/users/' + encodeURIComponent( username ), {
					method: 'PATCH',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify( { isAdmin } ),
				} );
				showStatus( ( isAdmin ? 'Made ' : 'Removed admin from ' ) + username + '.' );
				loadUsers();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		async function deleteUserRow( username ) {

			if ( ! confirm( 'Delete user "' + username + '"? This cannot be undone.' ) ) return;

			try {

				await api( '/admin/api/users/' + encodeURIComponent( username ), { method: 'DELETE' } );
				showStatus( 'Deleted ' + username + '.' );
				loadUsers();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		document.getElementById( 'addUserForm' ).addEventListener( 'submit', async ( e ) => {

			e.preventDefault();

			const username = document.getElementById( 'newUsername' ).value.trim();
			const password = document.getElementById( 'newPassword' ).value;
			const isAdmin = document.getElementById( 'newIsAdmin' ).checked;

			try {

				await api( '/admin/api/users', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify( { username, password, isAdmin } ),
				} );
				showStatus( 'Created ' + username + '.' );
				e.target.reset();
				loadUsers();

			} catch ( e2 ) {

				showStatus( e2.message, true );

			}

		} );

		// Password reset dialog

		const passwordDialog = document.getElementById( 'passwordDialog' );
		let pendingUsername = '';

		function openPasswordDialog( username ) {

			pendingUsername = username;
			document.getElementById( 'dialogUsername' ).value = username;
			document.getElementById( 'dialogPassword' ).value = '';
			passwordDialog.showModal();

		}

		document.getElementById( 'dialogCancel' ).addEventListener( 'click', () => passwordDialog.close() );

		document.getElementById( 'passwordForm' ).addEventListener( 'submit', async ( e ) => {

			e.preventDefault();
			const password = document.getElementById( 'dialogPassword' ).value;

			try {

				await api( '/admin/api/users/' + encodeURIComponent( pendingUsername ), {
					method: 'PATCH',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify( { password } ),
				} );
				showStatus( 'Password updated for ' + pendingUsername + '.' );
				passwordDialog.close();

			} catch ( err ) {

				showStatus( err.message, true );

			}

		} );

		// --- Maps ------------------------------------------------------------

		async function loadMaps() {

			const { maps } = await api( '/admin/api/maps' );
			const body = document.getElementById( 'mapsBody' );
			const empty = document.getElementById( 'mapsEmpty' );

			const ids = Object.keys( maps ).sort();
			body.innerHTML = '';
			empty.hidden = ids.length > 0;

			for ( const id of ids ) {

				const m = maps[ id ];
				const tr = document.createElement( 'tr' );
				tr.innerHTML = `
					<td><code>${ escapeHTML( id ) }</code></td>
					<td>${ escapeHTML( m.title ) }</td>
					<td><span class="badge">${ escapeHTML( m.category ) }</span></td>
					<td>${ escapeHTML( m.mod || '—' ) }</td>
					<td></td>
					<td></td>
				`;

				const visTd = tr.children[ 4 ];
				const visBtn = document.createElement( 'button' );
				visBtn.textContent = m.hidden ? 'Hidden' : 'Visible';
				if ( m.hidden ) visBtn.style.color = 'var(--text-dim)';
				visBtn.addEventListener( 'click', () => toggleMapHidden( id, ! m.hidden ) );
				visTd.appendChild( visBtn );

				const actionsTd = tr.children[ 5 ];

				const editBtn = document.createElement( 'button' );
				editBtn.textContent = 'Edit';
				editBtn.addEventListener( 'click', () => openMapDialog( id, m ) );
				actionsTd.appendChild( editBtn );

				const delBtn = document.createElement( 'button' );
				delBtn.textContent = 'Delete';
				delBtn.className = 'danger';
				delBtn.addEventListener( 'click', () => deleteMapRow( id ) );
				actionsTd.appendChild( delBtn );

				body.appendChild( tr );

			}

		}

		async function toggleMapHidden( id, hidden ) {

			try {

				await api( '/admin/api/maps/' + encodeURIComponent( id ), {
					method: 'PATCH',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify( { hidden } ),
				} );
				showStatus( ( hidden ? 'Hid ' : 'Unhid ' ) + id + '.' );
				loadMaps();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		async function deleteMapRow( id ) {

			if ( ! confirm( 'Remove "' + id + '" from the catalog? (The map file itself is untouched -- this only removes the listing.)' ) ) return;

			try {

				await api( '/admin/api/maps/' + encodeURIComponent( id ), { method: 'DELETE' } );
				showStatus( 'Removed ' + id + '.' );
				loadMaps();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		// Add/edit dialog

		const mapDialog = document.getElementById( 'mapDialog' );
		const mapIdInput = document.getElementById( 'mapId' );
		let editingMapId = null; // null while adding a new map

		function openMapDialog( id, entry ) {

			editingMapId = id || null;
			document.getElementById( 'mapDialogTitle' ).textContent = id ? 'Edit map' : 'Add map';

			mapIdInput.value = id || '';
			mapIdInput.disabled = !! id; // ID is fixed once created -- it has to match the actual map file

			document.getElementById( 'mapTitle' ).value = ( entry && entry.title ) || '';
			document.getElementById( 'mapCategory' ).value = ( entry && entry.category ) || 'mod';
			document.getElementById( 'mapMod' ).value = ( entry && entry.mod ) || '';
			document.getElementById( 'mapLayers' ).value = ( entry && entry.layers ) ? entry.layers.join( ', ' ) : '';
			document.getElementById( 'mapBlurb' ).value = ( entry && entry.blurb ) || '';
			document.getElementById( 'mapHidden' ).checked = !! ( entry && entry.hidden );

			mapDialog.showModal();

		}

		document.getElementById( 'addMapBtn' ).addEventListener( 'click', () => openMapDialog( null, null ) );
		document.getElementById( 'mapDialogCancel' ).addEventListener( 'click', () => mapDialog.close() );

		document.getElementById( 'mapForm' ).addEventListener( 'submit', async ( e ) => {

			e.preventDefault();

			const body = {
				title: document.getElementById( 'mapTitle' ).value.trim(),
				category: document.getElementById( 'mapCategory' ).value,
				mod: document.getElementById( 'mapMod' ).value.trim(),
				layers: document.getElementById( 'mapLayers' ).value,
				blurb: document.getElementById( 'mapBlurb' ).value.trim(),
				hidden: document.getElementById( 'mapHidden' ).checked,
			};

			try {

				if ( editingMapId ) {

					await api( '/admin/api/maps/' + encodeURIComponent( editingMapId ), {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify( body ),
					} );
					showStatus( 'Updated ' + editingMapId + '.' );

				} else {

					const id = mapIdInput.value.trim();
					await api( '/admin/api/maps', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify( Object.assign( { id }, body ) ),
					} );
					showStatus( 'Added ' + id + '.' );

				}

				mapDialog.close();
				loadMaps();

			} catch ( err ) {

				showStatus( err.message, true );

			}

		} );

		// --- Rooms -----------------------------------------------------------

		async function loadRooms() {

			const { rooms } = await api( '/admin/api/rooms' );
			const body = document.getElementById( 'roomsBody' );
			const empty = document.getElementById( 'roomsEmpty' );

			body.innerHTML = '';
			empty.hidden = rooms.length > 0;

			for ( const r of rooms.sort( ( a, b ) => b.createdAt - a.createdAt ) ) {

				const tr = document.createElement( 'tr' );
				tr.innerHTML = `
					<td>${ escapeHTML( r.id ) }${ r.persistent ? ' <span class="badge hub">hub</span>' : '' }</td>
					<td>${ escapeHTML( r.map ) }</td>
					<td>${ escapeHTML( r.mod || '—' ) }</td>
					<td>${ r.playerCount }/${ r.maxPlayers }</td>
					<td>${ fmtDate( r.createdAt ) }</td>
					<td></td>
				`;

				const actionsTd = tr.querySelector( 'td:last-child' );
				const endBtn = document.createElement( 'button' );
				endBtn.textContent = 'Terminate';
				endBtn.className = 'danger';
				endBtn.disabled = r.persistent;
				endBtn.addEventListener( 'click', () => terminateRoom( r.id ) );
				actionsTd.appendChild( endBtn );

				body.appendChild( tr );

			}

		}

		async function terminateRoom( id ) {

			if ( ! confirm( 'Terminate room ' + id + '? Anyone still in it will be disconnected.' ) ) return;

			try {

				await api( '/admin/api/rooms/' + encodeURIComponent( id ), { method: 'DELETE' } );
				showStatus( 'Terminated ' + id + '.' );
				loadRooms();

			} catch ( e ) {

				showStatus( e.message, true );

			}

		}

		// --- Init --------------------------------------------------------

		if ( session !== null ) {

			loadUsers().catch( ( e ) => showStatus( e.message, true ) );
			loadMaps().catch( ( e ) => showStatus( e.message, true ) );
			loadRooms().catch( ( e ) => showStatus( e.message, true ) );
			setInterval( () => loadRooms().catch( () => {} ), 15000 );

		}
