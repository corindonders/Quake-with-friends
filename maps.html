<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Quake with Friends — Maps</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		:root {
			--bg: #0b0908;
			--panel: #171310;
			--panel-border: #332920;
			--text: #d8cfc4;
			--text-dim: #8a7d6e;
			--accent: #b23b2e;
			--accent-bright: #e0523f;
			--locked: #4a4038;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			padding: 0;
			background: var(--bg);
			color: var(--text);
			font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
		}

		header {
			display: flex;
			align-items: center;
			gap: 16px;
			padding: 28px 32px 20px;
			border-bottom: 1px solid var(--panel-border);
		}

		header img { width: 40px; height: 40px; flex-shrink: 0; }

		header h1 {
			margin: 0;
			font-size: 22px;
			letter-spacing: 0.5px;
			font-weight: 600;
		}

		header p {
			margin: 4px 0 0;
			font-size: 13px;
			color: var(--text-dim);
		}

		main {
			max-width: 1100px;
			margin: 0 auto;
			padding: 24px 32px 64px;
		}

		.toolbar {
			display: flex;
			gap: 12px;
			align-items: center;
			margin-bottom: 28px;
			flex-wrap: wrap;
		}

		#filter {
			flex: 1;
			min-width: 200px;
			background: var(--panel);
			border: 1px solid var(--panel-border);
			color: var(--text);
			padding: 9px 12px;
			border-radius: 4px;
			font-size: 14px;
			outline: none;
		}

		#filter:focus { border-color: var(--accent); }

		#regStatus {
			font-size: 12px;
			color: var(--text-dim);
			white-space: nowrap;
		}

		#regStatus.have { color: #7fae6c; }

		section { margin-bottom: 36px; }

		section h2 {
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 1.5px;
			color: var(--text-dim);
			margin: 0 0 12px;
			padding-bottom: 8px;
			border-bottom: 1px solid var(--panel-border);
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
			gap: 12px;
		}

		.card {
			display: block;
			background: var(--panel);
			border: 1px solid var(--panel-border);
			border-radius: 6px;
			padding: 14px 16px;
			text-decoration: none;
			color: var(--text);
			cursor: pointer;
			transition: border-color 0.15s, transform 0.15s, background 0.15s;
			position: relative;
		}

		.card:hover:not(.locked) {
			border-color: var(--accent);
			background: #1e1712;
			transform: translateY(-1px);
		}

		.card .title {
			font-weight: 600;
			font-size: 14.5px;
			margin-bottom: 3px;
			padding-right: 64px;
			padding-left: 22px;
		}

		.card .num {
			position: absolute;
			top: 14px;
			left: 16px;
			font-size: 11.5px;
			color: var(--text-dim);
			font-variant-numeric: tabular-nums;
		}

		.card .id {
			font-family: 'Courier New', monospace;
			font-size: 11.5px;
			color: var(--accent-bright);
			margin-bottom: 6px;
			display: block;
		}

		.card .blurb {
			font-size: 12px;
			color: var(--text-dim);
			line-height: 1.4;
		}

		.card .badge {
			position: absolute;
			top: 12px;
			right: 12px;
			font-size: 10px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			padding: 2px 6px;
			border-radius: 3px;
			background: #2a2018;
			color: var(--text-dim);
		}

		.card.locked {
			cursor: default;
			opacity: 0.45;
		}

		.card.locked .title { color: var(--locked); }

		.card.locked .lock-note {
			font-size: 11px;
			color: var(--locked);
			margin-top: 6px;
			font-style: italic;
		}

		footer {
			text-align: center;
			padding: 24px;
			font-size: 12px;
			color: var(--text-dim);
		}

		footer a { color: var(--text-dim); }

		#empty {
			display: none;
			color: var(--text-dim);
			font-size: 13px;
			padding: 40px 0;
			text-align: center;
		}
	</style>
</head>
<body>

	<header>
		<img src="icon.svg" alt="">
		<div>
			<h1>Quake with Friends — Maps</h1>
			<p>Pick a level to load it straight in the browser.</p>
		</div>
	</header>

	<main>
		<div class="toolbar">
			<input id="filter" type="text" placeholder="Filter maps by name…">
			<span id="regStatus">checking for registered pak1.pak…</span>
		</div>

		<div id="sections"></div>
		<div id="empty">No maps match your filter.</div>
	</main>

	<footer>
		<a href="start.html">&larr; back</a>
		&middot; <a href="wiki.html">wiki</a>
	</footer>

	<script type="module">

		import { requireSession, fetchMapdb } from './src/auth_client.js';
		requireSession();

		// Fixed sections always shown first, in this order -- everything
		// else (one section per distinct mapdb `mod` value, e.g. Quoth,
		// Arcane Dimensions) is inserted between "Quake 1" and Deathmatch,
		// in MOD_ORDER below (falling back to alphabetical for anything not
		// listed there), so the page reads as "custom, base game, mods,
		// deathmatch" instead of one big undifferentiated "Mod Campaigns" pile.
		const LEAD_SECTIONS = [
			{ key: 'custom', label: 'Custom Maps' },
			{ key: 'vanilla-1', label: 'Quake 1 — Episode 1: Dimension of the Doomed' },
			{ key: 'vanilla-2', label: 'Quake 1 — Episode 2: The Realm of Black Magic' },
			{ key: 'vanilla-3', label: 'Quake 1 — Episode 3: The Netherworld' },
			{ key: 'vanilla-4', label: 'Quake 1 — Episode 4: The Elder World' },
		];
		const TRAIL_SECTIONS = [
			{ key: 'deathmatch', label: 'Deathmatch' },
		];

		// Preferred order for mod sections; anything else found in the
		// catalog is appended after these, alphabetically.
		const MOD_ORDER = [ 'Quoth', 'Arcane Dimensions' ];

		function sectionKeyFor( id, entry ) {

			if ( entry.category === 'vanilla' ) {

				if ( id === 'start' ) return 'vanilla-1';
				return 'vanilla-' + ( entry.episode || 1 );

			}

			// Any map tagged with a `mod` gets grouped under that mod's own
			// section, regardless of category -- e.g. the Q30 Deathmatch Jam
			// maps stay category "deathmatch" (so they're excluded from the
			// in-hub Travel panel like other deathmatch maps, see
			// travel_ui.js), but still get pulled out of the generic
			// "Deathmatch" pile into their own "Q30 Deathmatch Jam" section.
			if ( entry.mod ) return 'mod:' + entry.mod;
			if ( entry.category === 'mod' ) return 'mod:Other';

			return entry.category;

		}

		// Builds the full section list once the catalog is known, so mod
		// sections can be inserted between the fixed lead/trail ones above.
		function buildSections( bySection ) {

			const modKeys = Object.keys( bySection ).filter( ( k ) => k.startsWith( 'mod:' ) );
			modKeys.sort( ( a, b ) => {

				const nameA = a.slice( 4 ), nameB = b.slice( 4 );
				const iA = MOD_ORDER.indexOf( nameA ), iB = MOD_ORDER.indexOf( nameB );
				if ( iA !== - 1 && iB !== - 1 ) return iA - iB;
				if ( iA !== - 1 ) return - 1;
				if ( iB !== - 1 ) return 1;
				return nameA.localeCompare( nameB );

			} );

			const modSections = modKeys.map( ( key ) => ( { key, label: key.slice( 4 ) } ) );

			return [ ...LEAD_SECTIONS, ...modSections, ...TRAIL_SECTIONS ];

		}

		// Play order within a vanilla episode: the hub ("start") first,
		// then eNmM by mission number.
		function mapSequence( id ) {

			if ( id === 'start' ) return 0;
			const m = id.match( /m(\d+)/ );
			return m ? parseInt( m[ 1 ], 10 ) : 999;

		}

		function cardHTML( id, entry, locked, num ) {

			const badge = entry.mod ? entry.mod : ( entry.category === 'vanilla' ? '' : entry.category );
			const badgeHTML = badge ? '<span class="badge">' + escapeHTML( badge ) + '</span>' : '';
			const blurb = entry.blurb ? '<div class="blurb">' + escapeHTML( entry.blurb ) + '</div>' : '';
			const lockNote = locked ? '<div class="lock-note">Requires registered pak1.pak</div>' : '';
			const numHTML = num ? '<span class="num">' + num + '</span>' : '';

			const tag = locked ? 'div' : 'a';
			const href = locked ? '' : ( 'href="index.html?map=' + encodeURIComponent( id ) + '"' );

			return '<' + tag + ' class="card' + ( locked ? ' locked' : '' ) + '" ' + href + ' data-name="' +
				escapeHTML( ( entry.title + ' ' + id ).toLowerCase() ) + '">' +
				numHTML +
				badgeHTML +
				'<div class="title">' + escapeHTML( entry.title ) + '</div>' +
				'<span class="id">' + escapeHTML( id ) + '</span>' +
				blurb + lockNote +
				'</' + tag + '>';

		}

		function escapeHTML( s ) {

			const div = document.createElement( 'div' );
			div.textContent = s;
			return div.innerHTML;

		}

		async function hasRegisteredPak() {

			try {

				const r = await fetch( 'pak1.pak', { method: 'HEAD' } );
				return r.ok;

			} catch ( e ) {

				return false;

			}

		}

		async function main() {

			const [ mapdb, haveRegistered ] = await Promise.all( [
				fetchMapdb(),
				hasRegisteredPak()
			] );

			const regStatus = document.getElementById( 'regStatus' );
			if ( haveRegistered ) {

				regStatus.textContent = 'Registered pak1.pak detected — full campaign unlocked';
				regStatus.classList.add( 'have' );

			} else {

				regStatus.textContent = 'Shareware only — episodes 2-4 & deathmatch maps need your own pak1.pak';

			}

			const bySection = {};
			for ( const [ id, entry ] of Object.entries( mapdb ) ) {

				const key = sectionKeyFor( id, entry );
				if ( ! bySection[ key ] ) bySection[ key ] = [];
				bySection[ key ].push( [ id, entry ] );

			}

			const container = document.getElementById( 'sections' );

			for ( const { key, label } of buildSections( bySection ) ) {

				const entries = bySection[ key ];
				if ( ! entries || entries.length === 0 ) continue;

				// Only the vanilla episodes have a real, meaningful play
				// order (the hub, then m1..m8) -- custom/mod/deathmatch
				// maps are just an unordered catalog, so leave them unnumbered.
				const ordered = key.startsWith( 'vanilla-' );
				if ( ordered ) entries.sort( ( a, b ) => mapSequence( a[ 0 ] ) - mapSequence( b[ 0 ] ) );

				const section = document.createElement( 'section' );
				section.dataset.section = key;

				const h2 = document.createElement( 'h2' );
				h2.textContent = label;
				section.appendChild( h2 );

				const grid = document.createElement( 'div' );
				grid.className = 'grid';

				let mapNum = 0;
				for ( const [ id, entry ] of entries ) {

					const locked = entry.requiresRegistered && ! haveRegistered;
					mapNum++;
					grid.insertAdjacentHTML( 'beforeend', cardHTML( id, entry, locked, ordered ? mapNum : 0 ) );

				}

				section.appendChild( grid );
				container.appendChild( section );

			}

			const filterInput = document.getElementById( 'filter' );
			const emptyMsg = document.getElementById( 'empty' );

			filterInput.addEventListener( 'input', () => {

				const q = filterInput.value.trim().toLowerCase();
				let anyVisible = false;

				for ( const section of container.children ) {

					let sectionHasVisible = false;

					for ( const card of section.querySelectorAll( '.card' ) ) {

						const match = ! q || card.dataset.name.includes( q );
						card.style.display = match ? '' : 'none';
						if ( match ) sectionHasVisible = true;

					}

					section.style.display = sectionHasVisible ? '' : 'none';
					if ( sectionHasVisible ) anyVisible = true;

				}

				emptyMsg.style.display = anyVisible ? 'none' : 'block';

			} );

		}

		main();

	</script>

</body>
</html>
